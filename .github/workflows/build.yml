name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk StempelKam.apk
      - uses: actions/upload-artifact@v5
        with:
          name: StempelKam-apk
          path: StempelKam.apk
      - name: Publish release (APK siap unduh)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: StempelKam build ${{ github.run_number }}
          files: StempelKam.apk
          make_latest: true
